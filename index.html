<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD Posts Manager</title>
</head>

<body>
    <div id="app" class="min-h-screen bg-gray-100 p-6">

        <header class="mx-auto mb-8 max-w-5xl">
            <h1 class="text-3xl font-bold text-gray-900">
                CRUD Posts Manager
            </h1>
            <p class="mt-2 text-gray-600">
                Manage your posts using JSONPlaceholder API
            </p>
        </header>

        <main class="mx-auto max-w-5xl">

            <!-- Create Post Form -->
            <section class="mb-8 rounded-xl bg-white p-6 shadow">
                <h2 class="mb-4 text-xl font-semibold text-gray-800">
                    Create New Post
                </h2>

                <form id="post-form" class="space-y-4">
                    <input type="text" name="title" placeholder="Enter post title" required class="w-full rounded-lg border border-gray-300 p-3 text-gray-900" />

                    <textarea name="body" placeholder="Write your post..." required rows="4" class="w-full rounded-lg border border-gray-300 p-3 text-gray-900"></textarea>

                    <button type="submit" class="rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700">
              Publish Post
            </button>

                    <p id="form-status" class="text-sm text-gray-600"></p>
                </form>
            </section>

            <!-- Filter Section -->
            <section class="mb-6 flex items-center justify-between">
                <h2 class="text-xl font-bold text-gray-800">
                    All Posts
                </h2>

                <select id="user-filter" class="rounded-lg border border-gray-300 bg-white p-2 text-gray-900">
            <option value="">All Users</option>
          </select>
            </section>

            <!-- Posts Status -->
            <p id="posts-status" class="mb-4 text-gray-600"></p>

            <!-- Posts List -->
            <section id="posts-container" class="grid grid-cols-1 gap-5 md:grid-cols-2"></section>

        </main>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
